<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meus Dados · Demanda Rápida</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* (Usar as mesmas variáveis :root do código anterior) */
  :root{ --paper:#F1ECDE; --paper-deep:#E8E1CE; --ink:#1B2427; --ink-soft:#4B5559; --amber:#F0A202; --teal:#12525A; --line:#D3C9AC; --white:#FBF9F3; --radius:2px; --font-display:'Space Grotesk', sans-serif; --font-body:'IBM Plex Sans', sans-serif; --font-mono:'IBM Plex Mono', monospace; }
  *{ box-sizing:border-box; } body{ margin:0; background:var(--paper); color:var(--ink); font-family:var(--font-body); }
  body::before{ content:""; position:fixed; inset:0; background-image:radial-gradient(rgba(27,36,39,0.035) 1px, transparent 1px); background-size:3px 3px; pointer-events:none; }

  .wrap{ max-width:600px; margin:40px auto; padding:0 24px; }
  .back-link{ display:inline-block; font-family:var(--font-mono); font-size:0.75rem; color:var(--ink-soft); text-decoration:none; margin-bottom:20px; }
  
  h1{ font-family:var(--font-display); font-size:1.5rem; margin:0 0 8px; }
  .subtitle{ color:var(--ink-soft); font-size:0.9rem; margin-bottom:32px; }

  .form-card{ background:var(--white); border:1px solid var(--line); border-radius:var(--radius); box-shadow:4px 4px 0 var(--line); overflow:hidden; }
  .card-head{ background:var(--ink); color:var(--paper); padding:14px 24px; font-family:var(--font-mono); font-size:0.75rem; display:flex; justify-content:space-between; }
  
  .form-body{ padding:28px 24px; }
  .field{ margin-bottom:20px; }
  .field-row{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  
  label{ display:block; font-family:var(--font-mono); font-size:0.7rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-soft); margin-bottom:8px; }
  input{
    width:100%; font-family:var(--font-body); font-size:0.9rem; color:var(--ink);
    background:var(--paper); border:1px solid var(--line); border-radius:var(--radius);
    padding:12px; outline:none; transition:0.15s;
  }
  input:focus{ border-color:var(--teal); background:var(--white); }
  input:disabled{ opacity:0.6; cursor:not-allowed; }

  .btn-save{
    width:100%; background:var(--teal); color:var(--white); border:none; padding:14px;
    font-family:var(--font-display); font-weight:600; font-size:0.9rem; border-radius:var(--radius);
    box-shadow:3px 3px 0 var(--ink); cursor:pointer; margin-top:12px;
  }
  .btn-save:hover{ transform:translate(-2px,-2px); box-shadow:5px 5px 0 var(--ink); }

  .security-note{ margin-top:24px; padding:16px; background:rgba(18,82,90,0.05); border:1px solid var(--teal); border-radius:var(--radius); font-size:0.8rem; color:var(--teal); display:flex; gap:10px; align-items:flex-start; }

  @media(max-width:500px){ .field-row{ grid-template-columns:1fr; } }
</style>
</head>
<body>

<div class="wrap">
  <a href="dashboard-cliente.html" class="back-link">← Voltar ao painel</a>
  
  <h1>Meus Dados</h1>
<p class="subtitle">Essas informações são privadas e usadas para preencher suas demandas automaticamente.</p>

<form class="form-card" id="profileForm">
  <div class="card-head">
    <span>DADOS CADASTRAIS</span>
    <span>ID: 88392</span>
  </div>
  
  <div class="form-body">
    <div class="field">
      <label for="nome">Nome Completo</label>
      <input type="text" id="nome" value="Maria Oliveira" required>
    </div>

    <div class="field-row">
      <div class="field">
        <label for="whatsapp">WhatsApp</label>
        <input type="tel" id="whatsapp" value="(61) 99999-9999" required>
      </div>

      <div class="field">
        <label for="email">E-mail</label>
        <input 
          type="email" 
          id="email" 
          value="maria@email.com" 
          disabled 
          title="E-mail não pode ser alterado"
        >
      </div>
    </div>

    <div style="border-top:1px dashed var(--line); margin:28px 0; padding-top:24px;">
      <label style="color:var(--teal); margin-bottom:16px; display:block;">
        📍 Endereço Padrão (para novas demandas)
      </label>

      <!-- CEP -->
      <div class="field">
        <label for="cep">CEP</label>
        <input 
          type="text" 
          id="cep" 
          placeholder="00000-000"
          maxlength="9"
          inputmode="numeric"
          autocomplete="postal-code"
          required
        >
      </div>
      
      <div class="field-row">
        <div class="field">
          <label for="cidade">Cidade</label>
          <input 
            type="text" 
            id="cidade" 
            value="Brasília" 
            required
          >
        </div>

        <div class="field">
          <label for="bairro">Bairro Principal</label>
          <input 
            type="text" 
            id="bairro" 
            value="Águas Claras" 
            required
          >
        </div>
      </div>
      
      <div class="field">
        <label for="complemento">Ponto de referência (opcional)</label>
        <input 
          type="text" 
          id="complemento" 
          placeholder="Ex: Próximo ao shopping, bloco B..."
        >
      </div>
    </div>

    <button type="submit" class="btn-save">
      Salvar Alterações
    </button>
  </div>
</form>

  <div class="security-note">
    <span>🔒</span>
    <div>
      <strong>Seus dados estão seguros.</strong><br>
      Seu endereço e telefone só são revelados ao prestador <em>após</em> você aceitar a proposta dele e a Ordem de Serviço ser gerada.
    </div>
  </div>
</div>

<script>
  document.getElementById('profileForm').addEventListener('submit', (e) => {
    e.preventDefault();
    // Lógica Supabase: update na tabela 'clients' ou 'users'
    alert('Dados salvos com sucesso!');
  });
</script>
<script>
const cepInput = document.getElementById("cep");
const cidadeInput = document.getElementById("cidade");
const bairroInput = document.getElementById("bairro");

cepInput.addEventListener("input", function () {
  let cep = this.value.replace(/\D/g, "");

  if (cep.length > 5) {
    cep = cep.substring(0, 5) + "-" + cep.substring(5, 8);
  }

  this.value = cep;
});

cepInput.addEventListener("blur", async function () {
  const cep = this.value.replace(/\D/g, "");

  if (cep.length !== 8) {
    return;
  }

  try {
    const response = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
    const data = await response.json();

    if (data.erro) {
      alert("CEP não encontrado.");
      return;
    }

    cidadeInput.value = data.localidade || "";
    bairroInput.value = data.bairro || "";

  } catch (error) {
    console.error("Erro ao consultar CEP:", error);
    alert("Não foi possível consultar o CEP.");
  }
});
</script>
</body>
</html>
