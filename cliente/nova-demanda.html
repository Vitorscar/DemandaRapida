<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova Demanda · Demanda Rápida</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --paper:#F1ECDE; --ink:#1B2427; --ink-soft:#4B5559; --amber:#F0A202; --teal:#12525A; --line:#D3C9AC; --white:#FBF9F3; --radius:2px; --font-display:'Space Grotesk', sans-serif; --font-body:'IBM Plex Sans', sans-serif; --font-mono:'IBM Plex Mono', monospace; }
  *{ box-sizing:border-box; } body{ margin:0; background:var(--paper); color:var(--ink); font-family:var(--font-body); }
  body::before{ content:""; position:fixed; inset:0; background-image:radial-gradient(rgba(27,36,39,0.04) 1px, transparent 1px); background-size:4px 4px; pointer-events:none; }
  
  .topbar{ display:flex; justify-content:space-between; align-items:center; padding:16px 24px; max-width:600px; margin:0 auto; font-family:var(--font-mono); font-size:0.75rem; }
  .topbar a{ color:var(--ink-soft); text-decoration:none; border:1px solid var(--line); padding:6px 12px; border-radius:100px; }
  
  .wrap{ max-width:600px; margin:0 auto; padding:0 24px 60px; }
  h1{ font-family:var(--font-display); font-size:1.5rem; margin:0 0 24px; }
  
  form{ background:var(--white); border:1px solid var(--line); border-radius:var(--radius); box-shadow:4px 4px 0 var(--line); }
  .slip-head{ background:var(--ink); color:var(--paper); padding:12px 20px; font-family:var(--font-mono); font-size:0.7rem; display:flex; justify-content:space-between; }
  .slip-head .step{ color:var(--amber); }
  
  .field-group{ padding:24px; }
  .field{ margin-bottom:20px; }
  label{ display:block; font-family:var(--font-mono); font-size:0.7rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-soft); margin-bottom:8px; }
  input, select, textarea{
    width:100%; font-family:var(--font-body); font-size:0.9rem; color:var(--ink);
    background:var(--paper); border:1px solid var(--line); border-radius:var(--radius);
    padding:12px; outline:none; transition:0.15s;
  }
  input:focus, select:focus, textarea:focus{ border-color:var(--teal); background:var(--white); }
  textarea{ min-height:100px; resize:vertical; }
  .field-row{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  
  .btn-publish{
    width:100%; background:var(--amber); color:var(--ink); border:none; padding:14px;
    font-family:var(--font-display); font-weight:600; font-size:0.95rem; border-radius:var(--radius);
    box-shadow:3px 3px 0 var(--ink); cursor:pointer; transition:0.1s;
  }
  .btn-publish:hover{ transform:translate(-2px,-2px); box-shadow:5px 5px 0 var(--ink); }
  
  @media(max-width:500px){ .field-row{ grid-template-columns:1fr; } }
</style>
</head>
<body>

<div class="topbar">
  <span>Demanda<span style="color:var(--amber); font-weight:700;">rápida</span></span>
  <a href="dashboard-cliente.html">← Cancelar</a>
</div>

<div class="wrap">
  <h1>Publicar nova demanda</h1>
  
  <form id="novaDemandaForm">
    <div class="slip-head">
      <span>DETALHES DO SERVIÇO</span>
      <span class="step">PASSO 1 DE 2</span>
    </div>
    
    <div class="field-group">
      <div class="field">
        <label for="titulo">Título da demanda</label>
        <input type="text" id="titulo" placeholder="Ex: Instalação de chuveiro elétrico" required>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="categoria">Tipo de serviço</label>
          <select id="categoria" required>
            <option value="">Selecione...</option>
            <option value="eletrica">Elétrica</option>
            <option value="hidraulica">Hidráulica</option>
            <option value="pintura">Pintura</option>
            <option value="marcenaria">Marcenaria</option>
            <option value="arcondicionado">Ar-condicionado</option>
          </select>
        </div>
        <div class="field">
          <label for="data_limite">Data limite (opcional)</label>
          <input type="date" id="data_limite">
        </div>
      </div>

      <div class="field">
        <label for="descricao">Descreva o que precisa ser feito</label>
        <textarea id="descricao" placeholder="Quanto mais detalhes, melhores serão as propostas dos prestadores..." required></textarea>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="cidade">Cidade</label>
          <input type="text" id="cidade" value="Brasília" required>
        </div>
        <div class="field">
          <label for="bairro">Bairro</label>
          <input type="text" id="bairro" value="Águas Claras" required>
        </div>
      </div>
    </div>

    <div style="padding: 0 24px 24px;">
      <button type="submit" class="btn-publish">Publicar Demanda e Receber Propostas →</button>
    </div>
  </form>
</div>

<script>
  document.getElementById('novaDemandaForm').addEventListener('submit', (e) => {
    e.preventDefault();
    // Lógica Supabase: insert em 'demands' com status 'aberta'
    alert('Demanda publicada! Redirecionando para acompanhamento...');
    window.location.href = 'minhas-demandas.html';
  });
</script>
</body>
</html>
