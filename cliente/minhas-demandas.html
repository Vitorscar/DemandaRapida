<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minhas demandas · Demanda Rápida</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F1ECDE; --paper-deep:#E8E1CE; --ink:#1B2427; --ink-soft:#4B5559;
    --amber:#F0A202; --amber-deep:#C67F00; --teal:#12525A; --teal-soft:#3E7C6B;
    --line:#D3C9AC; --danger:#B3402F; --white:#FBF9F3; --radius:2px;
    --font-display:'Space Grotesk', sans-serif; --font-body:'IBM Plex Sans', sans-serif; --font-mono:'IBM Plex Mono', monospace;
  }
  *{ box-sizing:border-box; } html,body{ margin:0; padding:0; }
  body{ background:var(--paper); color:var(--ink); font-family:var(--font-body); -webkit-font-smoothing:antialiased; }
  a{ color:inherit; text-decoration:none; } button{ font-family:inherit; cursor:pointer; }
  body::before{ content:""; position:fixed; inset:0; background-image:radial-gradient(rgba(27,36,39,0.035) 1px, transparent 1px); background-size:3px 3px; pointer-events:none; z-index:0; }

  .app{ display:grid; grid-template-columns:220px 1fr; min-height:100vh; position:relative; z-index:1; }
  aside{ background:var(--ink); color:var(--paper); padding:28px 20px; display:flex; flex-direction:column; gap:36px; }
  .brand{ font-family:var(--font-display); font-weight:700; font-size:1.15rem; display:flex; align-items:baseline; gap:6px; }
  .brand span{ color:var(--amber); font-family:var(--font-mono); font-size:0.7rem; font-weight:600; border:1px solid var(--amber); padding:2px 5px; border-radius:var(--radius); }
  nav{ display:flex; flex-direction:column; gap:2px; }
  .nav-item{ display:flex; align-items:center; gap:10px; padding:10px 10px; border-radius:var(--radius); font-size:0.9rem; color:rgba(241,236,222,0.65); border-left:2px solid transparent; }
  .nav-item:hover{ color:var(--paper); background:rgba(241,236,222,0.06); }
  .nav-item.active{ color:var(--white); background:rgba(240,162,2,0.12); border-left:2px solid var(--amber); font-weight:500; }
  .nav-icon{ width:16px; text-align:center; font-size:0.85rem; }
  .sidebar-foot{ margin-top:auto; padding-top:20px; border-top:1px solid rgba(241,236,222,0.14); font-size:0.75rem; color:rgba(241,236,222,0.5); line-height:1.5; }
  .role-tag{ display:inline-block; margin-top:8px; font-family:var(--font-mono); font-size:0.68rem; color:var(--teal-soft); border:1px dashed rgba(62,124,107,0.5); padding:3px 6px; border-radius:var(--radius); }

  main{ padding:30px 40px 60px; max-width:980px; }
  .topbar{ display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:6px; flex-wrap:wrap; gap:16px; }
  .topbar h1{ font-family:var(--font-display); font-weight:600; font-size:1.7rem; margin:0 0 2px; letter-spacing:-0.01em; }
  .topbar .sub{ font-size:0.85rem; color:var(--ink-soft); font-family:var(--font-mono); }
  .new-btn{
    background:var(--amber); color:var(--ink); border:none; padding:12px 20px; font-weight:600; font-size:0.88rem;
    border-radius:var(--radius); box-shadow:3px 3px 0 var(--ink); transition:transform 0.1s ease, box-shadow 0.1s ease;
  }
  .new-btn:hover{ transform:translate(-2px,-2px); box-shadow:5px 5px 0 var(--ink); }

  .toolbar{ display:flex; gap:14px; margin:26px 0 22px; flex-wrap:wrap; align-items:center; }
  .search-input{
    flex:1; min-width:200px; font-family:var(--font-body); font-size:0.88rem; padding:11px 14px;
    border:1px solid var(--line); border-radius:var(--radius); background:var(--white); outline:none;
  }
  .search-input:focus{ border-color:var(--teal); }
  .filters{ display:flex; gap:8px; flex-wrap:wrap; }
  .chip{ font-size:0.78rem; padding:7px 13px; border:1px solid var(--line); background:var(--white); border-radius:100px; color:var(--ink-soft); }
  .chip.active{ background:var(--ink); color:var(--paper); border-color:var(--ink); }

  .empty-state{ text-align:center; padding:60px 20px; color:var(--ink-soft); font-family:var(--font-mono); font-size:0.85rem; display:none; }

  .ticket-list{ display:flex; flex-direction:column; gap:16px; }
  .ticket{
    display:grid; grid-template-columns:96px 1fr; background:var(--white); border:1px solid var(--line);
    border-radius:var(--radius); overflow:hidden; transition:box-shadow 0.15s ease, transform 0.15s ease;
  }
  .ticket:hover{ box-shadow:4px 4px 0 var(--line); transform:translate(-1px,-1px); }
  .ticket-stub{
    background:var(--ink); color:var(--paper); padding:16px 12px; display:flex; flex-direction:column;
    justify-content:space-between; position:relative; border-right:2px dashed var(--paper-deep);
  }
  .ticket-stub::before, .ticket-stub::after{ content:""; position:absolute; right:-7px; width:14px; height:14px; background:var(--paper); border-radius:50%; }
  .ticket-stub::before{ top:-7px; } .ticket-stub::after{ bottom:-7px; }
  .ticket-date{ font-family:var(--font-mono); font-size:0.95rem; font-weight:600; line-height:1.2; }
  .ticket-date small{ display:block; font-size:0.62rem; font-weight:400; color:rgba(241,236,222,0.55); margin-top:2px; }
  .ticket-proposals{ font-family:var(--font-mono); font-size:0.66rem; color:var(--amber); }

  .ticket-body{ padding:16px 20px; display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap; }
  .ticket-main{ min-width:220px; }
  .ticket-service{ font-family:var(--font-display); font-weight:600; font-size:1.02rem; margin-bottom:3px; }
  .ticket-loc{ font-size:0.83rem; color:var(--ink-soft); }
  .ticket-desc{ font-size:0.8rem; color:var(--ink-soft); margin-top:6px; max-width:40ch; line-height:1.4; }
  .ticket-tags{ display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
  .tag{ font-family:var(--font-mono); font-size:0.66rem; padding:2px 7px; background:var(--paper-deep); border-radius:100px; color:var(--ink-soft); }

  .stamp{
    font-family:var(--font-display); font-weight:700; font-size:0.7rem; letter-spacing:0.03em; padding:6px 11px;
    border-radius:var(--radius); text-transform:uppercase; transform:rotate(-3deg); white-space:nowrap; border:2px solid currentColor;
  }
  .stamp.open{ color:var(--teal); }
  .stamp.receiving{ color:var(--amber-deep); }
  .stamp.selected{ color:var(--amber-deep); }
  .stamp.pending_conf{ color:var(--danger); }
  .stamp.done{ color:var(--teal-soft); opacity:0.8; }
  .stamp.cancelled{ color:var(--ink-soft); opacity:0.6; }

  .ticket-actions{ display:flex; flex-direction:column; align-items:flex-end; gap:6px; }
  .provider-mini{ font-size:0.76rem; color:var(--ink-soft); font-family:var(--font-mono); }
  .view-btn{ font-size:0.76rem; padding:8px 14px; border:1px solid var(--line); background:var(--paper); border-radius:100px; }

  @media (max-width: 720px){
    .app{ grid-template-columns:1fr; }
    aside{ flex-direction:row; align-items:center; padding:16px 18px; gap:20px; overflow-x:auto; }
    aside nav{ flex-direction:row; gap:4px; } .sidebar-foot{ display:none; }
    main{ padding:22px 18px 50px; }
    .ticket{ grid-template-columns:70px 1fr; }
    .ticket-body{ flex-direction:column; align-items:flex-start; }
    .ticket-actions{ align-items:flex-start; width:100%; }
    .view-btn{ width:100%; text-align:center; }
  }
</style>
</head>
<body>

<div class="app">
  <aside>
    <div class="brand">Demanda<span>rápida</span></div>
    <nav>
      <a class="nav-item active" href="#"><span class="nav-icon">✉</span> Minhas demandas</a>
      <a class="nav-item" href="nova-demanda.html"><span class="nav-icon">+</span> Nova demanda</a>
      <a class="nav-item" href="../publico/diretorio.html"><span class="nav-icon">◎</span> Buscar prestadores</a>
    </nav>
    <div class="sidebar-foot">
      João Pedro<br>Águas Claras
      <div class="role-tag">conta cliente</div>
    </div>
  </aside>

  <main>
    <div class="topbar">
      <div>
        <h1>Minhas demandas</h1>
        <div class="sub" id="results-count">carregando...</div>
      </div>
      <a class="new-btn" href="nova-demanda.html">+ Nova demanda</a>
    </div>

    <div class="toolbar">
      <input class="search-input" id="search" type="text" placeholder="Buscar por título ou local...">
    </div>
    <div class="filters" id="filters">
      <span class="chip active" data-filter="all">Todas</span>
      <span class="chip" data-filter="open">Aguardando propostas</span>
      <span class="chip" data-filter="receiving">Com propostas</span>
      <span class="chip" data-filter="selected">Em andamento</span>
      <span class="chip" data-filter="pending_conf">Aguardando confirmação</span>
      <span class="chip" data-filter="done">Concluídas</span>
    </div>

    <div class="ticket-list" id="list"></div>
    <div class="empty-state" id="empty">Nenhuma demanda encontrada com esse filtro.</div>
  </main>
</div>

<script>
  // ---- dados simulados (substituir por fetch ao Supabase depois) ----
  const DEMANDS = [
    { id: 823, title: "Instalação de chuveiro elétrico", category: "Elétrica", desc: "Chuveiro elétrico novo, só falta instalar. Tenho o material.",
      date: "27/08", loc: "Águas Claras", status: "receiving", proposals: 3, provider: null, origin: "marketplace" },
    { id: 819, title: "Revisão de disjuntor", category: "Elétrica", desc: "Disjuntor desarmando sozinho, preciso resolver essa semana.",
      date: "25/08", loc: "Águas Claras", status: "selected", proposals: 2, provider: "João Marcos", origin: "marketplace" },
    { id: 802, title: "Instalação elétrica — cômodo extra", category: "Elétrica", desc: "Instalação completa de fiação e tomadas em cômodo novo.",
      date: "20/08", loc: "Águas Claras", status: "pending_conf", proposals: 1, provider: "Carlos Elétrica", origin: "marketplace" },
    { id: 790, title: "Troca de fiação da cozinha", category: "Elétrica", desc: "Fiação antiga, trocar por completo antes da reforma.",
      date: "10/08", loc: "Águas Claras", status: "done", proposals: 4, provider: "Marcos Lima", origin: "marketplace" },
    { id: 771, title: "Instalação de ventilador de teto", category: "Elétrica", desc: "Ventilador novo já comprado, falta só instalar.",
      date: "02/08", loc: "Águas Claras", status: "open", proposals: 0, provider: null, origin: "marketplace" },
  ];

  const STAMP_LABEL = {
    open: "Aguardando propostas", receiving: "Propostas recebidas", selected: "Em andamento",
    pending_conf: "Aguardando confirmação", done: "Concluída", cancelled: "Cancelada"
  };

  let activeFilter = "all";
  let searchTerm = "";

  function render(){
    const list = document.getElementById("list");
    const empty = document.getElementById("empty");
    const filtered = DEMANDS.filter(d => {
      const matchesFilter = activeFilter === "all" || d.status === activeFilter;
      const matchesSearch = !searchTerm ||
        d.title.toLowerCase().includes(searchTerm) || d.loc.toLowerCase().includes(searchTerm);
      return matchesFilter && matchesSearch;
    });

    document.getElementById("results-count").textContent = `${filtered.length} demanda${filtered.length !== 1 ? "s" : ""}`;

    list.innerHTML = "";
    empty.style.display = filtered.length ? "none" : "block";

    filtered.forEach(d => {
      const el = document.createElement("div");
      el.className = "ticket";
      el.innerHTML = `
        <div class="ticket-stub">
          <span class="ticket-date">${d.date}<small>DEM #${d.id}</small></span>
          <span class="ticket-proposals">${d.proposals} proposta${d.proposals !== 1 ? "s" : ""}</span>
        </div>
        <div class="ticket-body">
          <div class="ticket-main">
            <div class="ticket-service">${d.title}</div>
            <div class="ticket-loc">${d.loc}</div>
            <div class="ticket-desc">"${d.desc}"</div>
            <div class="ticket-tags"><span class="tag">${d.category}</span></div>
          </div>
          <span class="stamp ${d.status}">${STAMP_LABEL[d.status]}</span>
          <div class="ticket-actions">
            ${d.provider ? `<span class="provider-mini">com ${d.provider}</span>` : ""}
            <a class="view-btn" href="detalhe-demanda.html">Ver detalhes →</a>
          </div>
        </div>`;
      list.appendChild(el);
    });
  }

  document.getElementById("filters").addEventListener("click", (e) => {
    const chip = e.target.closest(".chip");
    if(!chip) return;
    document.querySelectorAll("#filters .chip").forEach(c => c.classList.remove("active"));
    chip.classList.add("active");
    activeFilter = chip.dataset.filter;
    render();
  });

  document.getElementById("search").addEventListener("input", (e) => {
    searchTerm = e.target.value.trim().toLowerCase();
    render();
  });

  render();
</script>

</body>
</html>
